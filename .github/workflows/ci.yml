name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Frontend build
        run: npm run build:web
      - name: Worker build
        run: npm run build:worker
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build (SPA embed + worker)
        run: npm run build:all
      - name: E2E tests (dev-server + ローカル D1)
        run: |
          PORT=8793 SEED_ON_START=true node --import tsx src/dev-server.ts > /tmp/devserver.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8793/api/health > /dev/null && break
            sleep 1
          done
          npm run test:e2e

  integration:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests (ローカル D1 / in-memory)
        run: npm run test:integration

  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:all
      - name: Migrate D1 (remote)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          cat > .env <<EOF
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          D1_DATABASE_ID=$D1_DATABASE_ID
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          EOF
          node scripts/migrate.ts
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          cat > .env <<EOF
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          D1_DATABASE_ID=$D1_DATABASE_ID
          SESSION_SECRET=$SESSION_SECRET
          EOF
          node scripts/deploy.mjs --secrets
