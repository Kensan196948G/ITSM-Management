name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Frontend build
        run: npm run build:web
      - name: Worker build
        run: npm run build:worker
        env:
          NODE_ENV: production

  integration:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests (Neon test branch)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          cp .env.example .env
          node -e "
            const fs=require('fs');
            let e=fs.readFileSync('.env','utf8');
            e=e.replace(/^DATABASE_URL=.*$/m, 'DATABASE_URL='+process.env.DATABASE_URL);
            e=e.replace(/^SESSION_SECRET=.*$/m, 'SESSION_SECRET='+require('crypto').randomBytes(32).toString('hex'));
            fs.writeFileSync('.env', e);
          "
          npm run db:migrate
          npm run db:seed
          npm run test:integration

  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:all
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          cat > .env <<EOF
          CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
          DATABASE_URL=$DATABASE_URL
          SESSION_SECRET=$SESSION_SECRET
          EOF
          node scripts/deploy.mjs --secrets
