<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITSM Management — 統合ITサービスマネジメント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ITSM Management — Design Tokens (tech-utility / Datadog-GitHub)
   ============================================================ */
:root {
  --bg:        oklch(97.5% 0.004 250);
  --surface:   oklch(100% 0 0);
  --surface-2: oklch(96% 0.006 250);
  --fg:        oklch(24% 0.02 240);
  --fg-2:      oklch(38% 0.018 240);
  --muted:     oklch(51% 0.018 240);
  --muted-2:   oklch(65% 0.014 240);
  --border:    oklch(90.5% 0.008 240);
  --border-2:  oklch(84% 0.011 240);

  --accent:        oklch(55% 0.15 145);
  --accent-strong: oklch(47% 0.16 145);
  --accent-soft:   oklch(95% 0.04 145);
  --accent-fg:     oklch(42% 0.13 145);
  --accent-contrast: oklch(99% 0 0);

  --success:      oklch(52% 0.14 150);
  --success-bg:   oklch(95% 0.035 150);
  --success-fg:   oklch(42% 0.13 150);
  --danger:       oklch(57% 0.19 25);
  --danger-contrast: oklch(99% 0 0);
  --danger-bg:    oklch(96% 0.02 25);
  --danger-fg:    oklch(46% 0.17 25);
  --warning:      oklch(62% 0.14 72);
  --warning-bg:   oklch(97% 0.025 80);
  --warning-fg:   oklch(45% 0.12 65);
  --info:         oklch(55% 0.14 250);
  --info-bg:      oklch(96% 0.02 250);
  --info-fg:      oklch(44% 0.14 250);

  --font-sans: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;

  --sidebar-w: 248px;
  --header-h: 56px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 10px; --r-xl: 14px;
  --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.04);
  --shadow-md: 0 4px 12px oklch(0% 0 0 / 0.06);
  --shadow-lg: 0 12px 32px oklch(0% 0 0 / 0.14);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg:        oklch(19% 0.015 240);
  --surface:   oklch(23% 0.015 240);
  --surface-2: oklch(27% 0.016 240);
  --fg:        oklch(95% 0.004 240);
  --fg-2:      oklch(83% 0.01 240);
  --muted:     oklch(66% 0.015 240);
  --muted-2:   oklch(52% 0.014 240);
  --border:    oklch(33% 0.016 240);
  --border-2:  oklch(42% 0.016 240);

  --accent:        oklch(72% 0.15 145);
  --accent-strong: oklch(78% 0.15 145);
  --accent-soft:   oklch(28% 0.05 145);
  --accent-fg:     oklch(78% 0.14 145);
  --accent-contrast: oklch(24% 0.03 145);

  --success-bg:   oklch(28% 0.045 150); --success-fg:   oklch(78% 0.13 150); --success: oklch(72% 0.14 150);
  --danger-contrast: oklch(24% 0.02 25);
  --danger-bg:    oklch(28% 0.05 25);   --danger-fg:    oklch(76% 0.13 25);   --danger:  oklch(66% 0.17 25);
  --warning-bg:   oklch(29% 0.045 80);  --warning-fg:   oklch(80% 0.12 75);   --warning: oklch(72% 0.13 72);
  --info-bg:      oklch(28% 0.04 250);  --info-fg:      oklch(78% 0.12 250);  --info:    oklch(70% 0.13 250);

  --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3);
  --shadow-md: 0 4px 12px oklch(0% 0 0 / 0.35);
  --shadow-lg: 0 12px 32px oklch(0% 0 0 / 0.5);
}

/* ── Reset / Base ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.7;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; color: inherit; }
.tnum { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.mono { font-family: var(--font-mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

/* ── App Shell ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w); background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  height: 100vh; position: fixed; left: 0; top: 0; z-index: 50;
  transition: width .22s var(--ease), transform .22s var(--ease); overflow: hidden;
}
.sidebar--collapsed { width: 64px; }

.sidebar__logo { display: flex; align-items: center; gap: 11px; padding: 15px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar__logo-mark { width: 32px; height: 32px; border-radius: var(--r-md); background: var(--accent); color: var(--accent-contrast); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; letter-spacing: -0.02em; flex-shrink: 0; }
.sidebar__logo-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; line-height: 1.2; }
.sidebar__logo-sub { font-size: 10px; color: var(--accent-fg); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

.sidebar__search { padding: 12px 14px; flex-shrink: 0; }
.sidebar__search input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--r-md); font-size: 12px; background: var(--surface-2); color: var(--fg); outline: none; transition: border-color .15s var(--ease); }
.sidebar__search input:focus { border-color: var(--accent); }

.sidebar__nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 8px; }
.sidebar__section-title { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 12px 4px; font-size: 11px; color: var(--muted-2); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; text-align: left; }
.sidebar__item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 12px; border: none; background: none; border-radius: var(--r-md); color: var(--fg-2); font-size: 13px; text-align: left; cursor: pointer; transition: background .14s var(--ease), color .14s var(--ease); }
.sidebar__item:hover { background: var(--surface-2); color: var(--fg); }
.sidebar__item--active { background: var(--accent-soft); color: var(--accent-fg); font-weight: 600; }
.sidebar__item--active:hover { background: var(--accent-soft); color: var(--accent-fg); }
.sidebar__item svg { flex-shrink: 0; }
.sidebar__item-label { flex: 1; min-width: 0; }
.sidebar__item-label .l1 { font-weight: inherit; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar__item-label .l2 { font-size: 11px; color: var(--muted-2); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sidebar__footer { border-top: 1px solid var(--border); flex-shrink: 0; }
.sidebar__user { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sidebar__user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--fg-2); color: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.sidebar__user-name { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.sidebar__user-role { font-size: 11px; color: var(--muted-2); line-height: 1.3; }
.sidebar__foot-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: none; background: none; color: var(--fg-2); font-size: 13px; cursor: pointer; transition: background .14s var(--ease), color .14s var(--ease); }
.sidebar__foot-btn:hover { background: var(--surface-2); color: var(--fg); }

.main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; transition: margin-left .22s var(--ease); }
.sidebar--collapsed ~ .main { margin-left: 64px; }

.header { height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 40; }
.header__left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.header__title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header__crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-2); }
.header__right { display: flex; align-items: center; gap: 8px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--fg-2); cursor: pointer; transition: border-color .14s var(--ease), background .14s var(--ease); position: relative; }
.icon-btn:hover { border-color: var(--border-2); background: var(--surface-2); color: var(--fg); }
.icon-btn .dot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); border: 1.5px solid var(--surface); }

.content { flex: 1; padding: 20px 24px 32px; overflow-y: auto; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; }
.page-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
.page-head__actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer; transition: background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease); white-space: nowrap; line-height: 1; font-size: 13px; letter-spacing: 0.01em; }
.btn--md { padding: 9px 14px; }
.btn--sm { padding: 7px 11px; font-size: 12.5px; }
.btn--primary { background: var(--accent); color: var(--accent-contrast); }
.btn--primary:hover { background: var(--accent-strong); }
.btn--outline { background: var(--surface); color: var(--fg-2); border-color: var(--border-2); }
.btn--outline:hover { background: var(--surface-2); border-color: var(--muted-2); color: var(--fg); }
.btn--ghost { background: none; color: var(--fg-2); }
.btn--ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn--danger { background: var(--danger); color: var(--danger-contrast); }
.btn--danger:hover { background: oklch(49% 0.18 25); color: oklch(99% 0 0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn--icon { padding: 7px; }

/* ── Cards / KPI ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
.card__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card__head h3 { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
.card__body { padding: 16px 18px; }

.kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; display: flex; align-items: flex-start; gap: 14px; transition: box-shadow .16s var(--ease), transform .16s var(--ease); }
.kpi:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.kpi__icon { width: 38px; height: 38px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.kpi__icon svg { width: 19px; height: 19px; }
.kpi__label { font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.5; }
.kpi__value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; font-variant-numeric: tabular-nums; font-family: var(--font-mono); margin-top: 2px; }
.kpi__sub { font-size: 11px; color: var(--muted-2); margin-top: 2px; line-height: 1.5; }

.grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-2-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

/* ── Pills ── */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; line-height: 1.7; white-space: nowrap; border: 1px solid transparent; letter-spacing: 0.01em; }
.pill--success { background: var(--success-bg); color: var(--success-fg); border-color: oklch(from var(--success) l c h / 0.25); }
.pill--danger  { background: var(--danger-bg);  color: var(--danger-fg);  border-color: oklch(from var(--danger) l c h / 0.25); }
.pill--warning { background: var(--warning-bg); color: var(--warning-fg); border-color: oklch(from var(--warning) l c h / 0.25); }
.pill--info    { background: var(--info-bg);    color: var(--info-fg);    border-color: oklch(from var(--info) l c h / 0.25); }
.pill--neutral { background: var(--surface-2);  color: var(--muted);       border-color: var(--border); }
.pill__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* ── Filter bar ── */
.filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted-2); pointer-events: none; }
.search input { width: 240px; padding: 8px 10px 8px 32px; border: 1px solid var(--border); border-radius: var(--r-md); font-size: 12.5px; background: var(--surface); outline: none; transition: border-color .15s var(--ease); }
.search input:focus { border-color: var(--accent); }
.filter { display: flex; align-items: center; gap: 7px; }
.filter label { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.filter select { padding: 7px 28px 7px 10px; border: 1px solid var(--border); border-radius: var(--r-md); font-size: 12.5px; background: var(--surface); color: var(--fg); cursor: pointer; outline: none; transition: border-color .15s var(--ease); }
.filter select:focus { border-color: var(--accent); }
.filter-bar .spacer { flex: 1; }

/* ── Table ── */
.table-wrap { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.table-scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl thead th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; user-select: none; }
.tbl thead th.sortable { cursor: pointer; }
.tbl thead th.sortable:hover { color: var(--fg); }
.tbl tbody td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--fg); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr { transition: background .12s var(--ease); }
.tbl tbody tr.row-click { cursor: pointer; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .td-id { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl .td-title { font-weight: 500; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl .td-muted { color: var(--muted); }
.tbl .td-nowrap { white-space: nowrap; }
.tbl .td-actions { display: flex; gap: 2px; }
.row-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: none; background: none; border-radius: var(--r-sm); color: var(--muted); cursor: pointer; transition: background .12s var(--ease), color .12s var(--ease); }
.row-btn:hover { background: var(--surface-2); color: var(--fg); }
.row-btn--danger:hover { background: var(--danger-bg); color: var(--danger-fg); }
.sort-ind { font-size: 9px; margin-left: 4px; color: var(--accent-fg); }

.pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px 0; }
.pagination .count { font-size: 12px; color: var(--muted); }
.pagination .pages { display: flex; gap: 4px; }

/* ── Empty / loading ── */
.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty svg { width: 36px; height: 36px; margin: 0 auto 10px; opacity: 0.45; }
.empty p { font-size: 13px; }
.skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--surface-2) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--r-sm); }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-overlay__bg { position: absolute; inset: 0; background: oklch(15% 0.02 240 / 0.45); backdrop-filter: blur(2px); }
.modal { position: relative; width: min(640px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); overflow: hidden; animation: modalIn .18s var(--ease); }
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--border); }
.modal__head h3 { font-size: 15px; font-weight: 600; }
.modal__close { width: 30px; height: 30px; border: none; background: none; border-radius: var(--r-sm); color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal__close:hover { background: var(--surface-2); color: var(--fg); }
.modal__body { padding: 20px 22px; overflow-y: auto; }
.modal__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); }

/* ── Forms ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field--full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.field label .req { color: var(--danger); margin-left: 3px; }
.field input, .field select, .field textarea { padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--r-md); font-size: 13px; background: var(--surface); outline: none; transition: border-color .15s var(--ease); width: 100%; }
.field textarea { min-height: 78px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field .err { font-size: 11.5px; color: var(--danger-fg); }
.field .hint { font-size: 11.5px; color: var(--muted-2); }

/* ── Detail list ── */
.dl { display: grid; grid-template-columns: 118px 1fr; gap: 9px 16px; font-size: 13px; }
.dl dt { color: var(--muted); font-weight: 500; }
.dl dd { color: var(--fg); word-break: break-word; }

/* ── Charts ── */
.chart-box { display: flex; align-items: center; justify-content: center; }
.chart-legend { display: flex; flex-direction: column; gap: 9px; font-size: 12px; color: var(--fg-2); }
.chart-legend .li { display: flex; align-items: center; gap: 8px; }
.chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.hbar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar > div { height: 100%; border-radius: 99px; transition: width .5s var(--ease); }

/* ── Realtime ── */
.rt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.rt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; display: flex; align-items: center; gap: 14px; transition: box-shadow .16s var(--ease); }
.rt-card:hover { box-shadow: var(--shadow-md); }
.rt-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.rt-dot--pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 5px transparent; } }

/* ── Settings ── */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: none; }
.setting-row .sr-label { font-weight: 500; font-size: 13px; }
.setting-row .sr-desc { font-size: 11.5px; color: var(--muted-2); margin-top: 1px; }
.setting-row .sr-value { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }

/* ── Tag / misc ── */
.section-gap { margin-bottom: 16px; }

        items = items.filter(x => JSON.stringify(x).toLowerCase().includes(kw));

      Object.entries(params).forEach(([k, v]) => {

        items = items.filter(x => String(x[k]) === String(v));
      });
      if (params.sortKey) {
        const dir = params.sortDir === 'desc' ? -1 : 1;
        items.sort((a, b) => { const va = a[params.sortKey] || '', vb = b[params.sortKey] || ''; return va < vb ? -dir : va > vb ? dir : 0; });

      const slaOk = inc.filter(x => x.resolved_at && new Date(x.resolved_at) <= new Date(x.due_at)).length;
      const slaRate = resolved.length ? Math.round(slaOk / resolved.length * 100) : 100;
      return { total: inc.length, open, overdue, resolved: resolved.length, avgHours: Math.round(avgH * 10) / 10, slaRate, problems: store.problems.length, changes: store.changes.length, assets: store.assets.length, security: store.security.length };
    }
  };

  window.MockAPI = MockAPI;
  window.ITSM_USERS = USERS;
  window.__ITSM_DATA = { store, INCIDENTS };
})();
</script>

const fmtDate = (v, short) => {
  if (!v) return '—';
  const dt = new Date(v);
  if (isNaN(dt)) return '—';
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  const hh = String(dt.getHours()).padStart(2, '0');
  const mi = String(dt.getMinutes()).padStart(2, '0');
  return short ? `${mm}/${dd} ${hh}:${mi}` : `${dt.getFullYear()}/${mm}/${dd} ${hh}:${mi}`;
};

const fmtDateDay = (v) => {
  if (!v) return '—';
  const dt = new Date(v);
  if (isNaN(dt)) return '—';

};

    const id = Date.now() + Math.random();
    setToasts(p => [...p, { id, msg, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3400);
  }, []);
  return (
    <ToastCtx.Provider value={add}>
      {children}
      <div className="toast-wrap" aria-live="polite">
        {toasts.map(t => <div key={t.id} className={t.type ? `toast toast--${t.type}` : 'toast'}>{t.msg}</div>)}

const Modal = ({ open, onClose, title, children, footer, width = 640 }) => {
  const ref = useRef();
  useEffect(() => {
    if (!open) return;
    const h = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    if (ref.current) ref.current.focus();
    return () => document.removeEventListener('keydown', h);
  }, [open]);
  if (!open) return null;
  return ReactDOM.createPortal(
    <div className="modal-overlay" role="dialog" aria-modal="true" aria-label={title}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-overlay__bg" aria-hidden="true" />
      <div className="modal" style={{ width: `min(${width}px, 100%)` }} ref={ref} tabIndex={-1}>
        <div className="modal__head">
          <h3>{title}</h3>
          <button className="modal__close" onClick={onClose} aria-label="閉じる"><Icon name="x" size={16} /></button>
        </div>
        <div className="modal__body">{children}</div>
        {footer && <div className="modal__foot">{footer}</div>}

    </div>,
    document.body
  );
};

const DataTable = ({ columns, data, loading, sortKey, sortDir, onSort, onRowClick, emptyMsg, id }) => {
  if (loading) {
    return <div className="card" style={{ padding: 16 }}><div className="skeleton" style={{ height: 240 }} /></div>;
  }
  if (!data || !data.length) return <Empty message={emptyMsg} />;
  return (
    <div className="table-wrap" data-od-id={id}>
      <div className="table-scroll">
        <table className="tbl">
          <thead>
            <tr>
              {columns.map(col => (
                <th key={col.key} className={col.sortable ? 'sortable' : ''}
                  onClick={col.sortable ? () => onSort && onSort(col.key) : undefined}
                  aria-sort={sortKey === col.key ? (sortDir === 'asc' ? 'ascending' : 'descending') : undefined}>
                  {col.label}
                  {col.sortable && sortKey === col.key && <span className="sort-ind">{sortDir === 'asc' ? '▲' : '▼'}</span>}

              ))}
            </tr>
          </thead>
          <tbody>
            {data.map((row, i) => (
              <tr key={row.id || i} className={onRowClick ? 'row-click' : ''} onClick={onRowClick ? () => onRowClick(row) : undefined}>

                  <td key={col.key} className={col.cls}>

const Pagination = ({ page, total, size, onChange }) => {

      <div className="pages">
        <Btn variant="outline" size="sm" disabled={page <= 1} onClick={() => onChange(page - 1)}>前へ</Btn>
        {Array.from({ length: Math.min(pages, 7) }, (_, i) => {
          const p = i + 1;
          return <Btn key={p} variant={p === page ? 'primary' : 'outline'} size="sm" onClick={() => onChange(p)}>{p}</Btn>;
        })}
        <Btn variant="outline" size="sm" disabled={page >= pages} onClick={() => onChange(page + 1)}>次へ</Btn>
      </div>
    </div>
  );
};

/* ============================================================
   Charts (SVG, filled data encoding)
   ============================================================ */
const BarChart = ({ data, height = 150, color = 'var(--accent)' }) => {
  if (!data || !data.length) return null;
  const W = 460, H = height;
  const max = Math.max(1, ...data.map(d => d.value));
  const pad = { top: 14, bottom: 26, left: 4, right: 4 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
  const barW = Math.min(42, (cw / data.length) * 0.55);
  const step = cw / data.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }} role="img" aria-label="バーチャート">
      {[0.25, 0.5, 0.75, 1].map(f => (
        <line key={f} x1={pad.left} x2={W - pad.right} y1={pad.top + ch * (1 - f)} y2={pad.top + ch * (1 - f)}
          stroke="var(--border)" strokeDasharray="3 4" strokeWidth="1" />
      ))}
      {data.map((d, i) => {
        const x = pad.left + step * i + (step - barW) / 2;
        const bh = (d.value / max) * ch;
        const y = pad.top + ch - bh;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={bh} rx="4" fill={color} opacity="0.9" />
            <text x={x + barW / 2} y={y - 6} textAnchor="middle" fontSize="11" fontFamily="var(--font-mono)" fill="var(--muted)">{d.value}</text>
            <text x={x + barW / 2} y={H - 8} textAnchor="middle" fontSize="10.5" fill="var(--muted-2)">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
};

const LineChart = ({ data, height = 190, color = 'var(--accent)' }) => {
  if (!data || !data.length) return null;
  const W = 620, H = height;
  const max = Math.max(1, ...data.map(d => d.value));
  const pad = { top: 16, bottom: 30, left: 28, right: 16 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
  const pts = data.map((d, i) => ({
    x: pad.left + (i / Math.max(1, data.length - 1)) * cw,
    y: pad.top + ch - (d.value / max) * ch, ...d
  }));
  const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ');
  const area = `${line} L${pts[pts.length - 1].x},${pad.top + ch} L${pts[0].x},${pad.top + ch} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }} role="img" aria-label="ラインチャート">
      {[0, 0.5, 1].map(f => (
        <line key={f} x1={pad.left} x2={W - pad.right} y1={pad.top + ch * (1 - f)} y2={pad.top + ch * (1 - f)}
          stroke="var(--border)" strokeDasharray="3 4" strokeWidth="1" />
      ))}
      <path d={area} fill={color} opacity="0.1" />
      <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4" fill="var(--surface)" stroke={color} strokeWidth="2" />
          <text x={p.x} y={p.y - 10} textAnchor="middle" fontSize="11" fontFamily="var(--font-mono)" fill="var(--fg-2)" fontWeight="600">{p.value}</text>
          <text x={p.x} y={H - 10} textAnchor="middle" fontSize="10.5" fill="var(--muted-2)">{p.label}</text>
        </g>
      ))}
    </svg>
  );
};

const DonutChart = ({ data, size = 150, thickness = 18, centerLabel, centerSub }) => {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const cx = size / 2, cy = size / 2, r = (size - thickness) / 2;
  const circum = 2 * Math.PI * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="ドーナツチャート">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-2)" strokeWidth={thickness} />
      {data.map((d, i) => {
        const pct = d.value / total;
        const dash = pct * circum;
        const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth={thickness}
          strokeDasharray={`${dash} ${circum - dash}`} strokeDashoffset={-offset} strokeLinecap="round" />;
        offset += dash;
        return el;
      })}
      <text x={cx} y={cy - (centerSub ? 8 : 0)} textAnchor="middle" dominantBaseline="central"
        fontSize="26" fontWeight="700" fontFamily="var(--font-mono)" fill="var(--fg)">{centerLabel}</text>
      {centerSub && <text x={cx} y={cy + 18} textAnchor="middle" fontSize="10.5" fill="var(--muted-2)">{centerSub}</text>}
    </svg>
  );
};

const DashboardView = ({ onNewIncident }) => {
  const toast = useToast();
  const summary = useMemo(() => MockAPI.getDashboardSummary(), []);

  const trend = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push({ label: `${d.getMonth() + 1}/${d.getDate()}`, value: 0, key: d.toISOString().slice(0, 10) });
    }
    window.__ITSM_DATA.store.incidents.forEach(inc => {
      const k = inc.created_at.slice(0, 10);
      const s = days.find(x => x.key === k);
      if (s) s.value++;
    });
    return days;
  }, []);

  const priorityDist = useMemo(() => {
    const order = ['critical', 'high', 'medium', 'low'];
    const count = {};
    window.__ITSM_DATA.store.incidents.forEach(i => { count[i.priority] = (count[i.priority] || 0) + 1; });
    return order.filter(k => count[k]).map(k => ({ label: LABELS[k], value: count[k] }));
  }, []);

  const categoryDist = useMemo(() => {
    const map = {};
    window.__ITSM_DATA.store.incidents.forEach(i => { map[i.category] = (map[i.category] || 0) + 1; });
    const colors = ['var(--info)', 'var(--accent)', 'var(--warning)', 'var(--danger)', 'var(--muted-2)'];
    return Object.entries(map).sort((a, b) => b[1] - a[1]).map(([label, value], i) => ({ label, value, color: colors[i % colors.length] }));
  }, []);

  const siteData = useMemo(() => {
    const map = {};
    window.__ITSM_DATA.store.incidents.forEach(i => {
      if (['resolved', 'closed'].includes(i.status)) return;
      map[i.site] = (map[i.site] || 0) + 1;
    });
    return Object.entries(map).map(([name, incidents]) => ({ name, incidents }));
  }, []);

  const slaDonut = useMemo(() => [
    { value: summary.slaRate, color: 'var(--accent)' },
    { value: 100 - summary.slaRate, color: 'var(--surface-2)' },
  ], [summary]);

  return (
    <div>
      <div className="page-head" data-od-id="dashboard-head">
        <div>
          <h1>ダッシュボード</h1>
          <div className="sub">ITSM 全体の稼働状況と主要メトリクス。直近データを集約しています。</div>
        </div>
        <div className="page-head__actions">
          <Btn variant="outline" icon="download" onClick={() => toast('レポート出力（デモ）', 'info')}>レポート出力</Btn>
          <Btn variant="primary" icon="plus" onClick={onNewIncident}>新規インシデント</Btn>
        </div>
      </div>

      <div className="kpi-grid">
        <KPI id="kpi-total" icon="ticket" label="総チケット数" value={String(summary.total)} sub="全期間" tone="info" />
        <KPI id="kpi-open" icon="hourglass" label="未対応" value={String(summary.open)} sub="要対応" tone="warning" />
        <KPI id="kpi-overdue" icon="alert" label="SLA違反" value={String(summary.overdue)} sub="期限超過" tone="danger" />
        <KPI id="kpi-sla" icon="check" label="SLA遵守率" value={summary.slaRate + '%'} sub="解決済ベース" tone="success" />
        <KPI id="kpi-avg" icon="clock" label="平均解決時間" value={summary.avgHours + 'h'} sub="解決済チケット" tone="accent" />
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card__head"><h3>直近7日のインシデント推移</h3><span className="demo-note">作成ベース</span></div>
          <div className="card__body"><LineChart data={trend} /></div>
        </div>
        <div className="card">
          <div className="card__head"><h3>SLA遵守率</h3></div>
          <div className="card__body" style={{ display: 'flex', alignItems: 'center', gap: 28 }}>
            <DonutChart data={slaDonut} centerLabel={summary.slaRate + '%'} centerSub="遵守率" />
            <div className="chart-legend">
              <div className="li"><span className="sw" style={{ background: 'var(--accent)' }} />遵守 {summary.slaRate}%</div>
              <div className="li"><span className="sw" style={{ background: 'var(--surface-2)' }} />違反 {100 - summary.slaRate}%</div>
              <div className="li" style={{ color: 'var(--muted-2)', fontSize: 11.5 }}>解決済 {summary.resolved} 件を集計</div>
            </div>
          </div>
        </div>
      </div>

      <div className="grid-2-eq">
        <div className="card">
          <div className="card__head"><h3>優先度別の未解決分布</h3></div>
          <div className="card__body"><BarChart data={priorityDist} /></div>

        <div className="card">

      </div>

      <div className="card">
        <div className="card__head">
          <h3>拠点別の未解決インシデント</h3>
        </div>
        <div className="card__body">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 12 }}>
            {siteData.map(s => (
              <div key={s.name} style={{ padding: '14px 16px', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

                  <div style={{ fontWeight: 600, fontSize: 13 }}>{s.name}</div>

                  <span className="pill__dot" />{s.incidents >= 4 ? '注意' : s.incidents >= 2 ? '警戒' : '安定'}
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

const SLAPill = ({ dueAt, resolvedAt }) => {
  if (!dueAt) return <span style={{ color: 'var(--muted-2)', fontSize: 11.5 }}>—</span>;
  const due = new Date(dueAt);
  if (resolvedAt) return <Pill value={new Date(resolvedAt) <= due ? 'resolved' : 'critical'} />;
  const remaining = due - new Date();
  if (remaining < 0) return <span className="pill pill--danger"><span className="pill__dot" />超過</span>;
  if (remaining < 2 * 3600000) return <span className="pill pill--warning"><span className="pill__dot" />注意</span>;
  return <span className="pill pill--success"><span className="pill__dot" />安全</span>;
};

const ModuleView = ({ moduleKey }) => {
  const cfg = MODULE_CONFIGS[moduleKey];
  const [data, setData] = useState({ items: [], total: 0 });
  const [loading, setLoading] = useState(true);
  const [keyword, setKeyword] = useState('');
  const [filters, setFilters] = useState({});
  const [sortKey, setSortKey] = useState('');
  const [sortDir, setSortDir] = useState('desc');
  const [page, setPage] = useState(1);
  const [modalOpen, setModalOpen] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [formData, setFormData] = useState({});
  const [formErrors, setFormErrors] = useState({});
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [detailItem, setDetailItem] = useState(null);
  const toast = useToast();
  const pageSize = 10;

  const loadData = useCallback(async () => {
    setLoading(true);
    try {
      const params = { ...filters, keyword: keyword || undefined, skip: (page - 1) * pageSize, limit: pageSize, sortKey, sortDir };
      setData(await MockAPI.list(cfg.dataKey, params));
    } catch (e) { console.error(e); }
    setLoading(false);
  }, [cfg.dataKey, keyword, filters, page, sortKey, sortDir]);

  useEffect(() => { loadData(); }, [loadData]);
  useEffect(() => { setPage(1); setKeyword(''); setFilters({}); setSortKey(''); }, [moduleKey]);

  const handleSort = key => {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('desc'); }
  };

  const openCreate = () => { setEditItem(null); setFormData(cfg.defaults || {}); setFormErrors({}); setModalOpen(true); };
  const openEdit = item => { setEditItem(item); setFormData({ ...item }); setFormErrors({}); setModalOpen(true); };

  const handleSave = async () => {
    const errs = {};
    (cfg.formFields || []).forEach(f => { if (f.required && !formData[f.key]) errs[f.key] = '必須項目です'; });
    if (Object.keys(errs).length) { setFormErrors(errs); return; }
    if (editItem) { await MockAPI.update(cfg.dataKey, editItem.id, formData); toast(`${cfg.label}を更新しました`, 'success'); }
    else { await MockAPI.create(cfg.dataKey, formData); toast(`${cfg.label}を登録しました`, 'success'); }
    setModalOpen(false); loadData();
  };

  const handleDelete = async () => {
    await MockAPI.remove(cfg.dataKey, deleteTarget.id);
    toast('削除しました', 'success'); setDeleteTarget(null); loadData();
  };

  const kpis = cfg.kpis ? cfg.kpis(data) : [];

  const renderField = f => {
    const common = {
      value: formData[f.key] || '',
      onChange: e => setFormData(p => ({ ...p, [f.key]: e.target.value }))
    };
    if (f.type === 'textarea') return <textarea {...common} />;
    if (f.type === 'select') return <select {...common}><option value="">選択してください</option>{f.options.map(o => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : (LABELS[o] || o); return <option key={v} value={v}>{l}</option>; })}</select>;
    if (f.type === 'date') return <input type="datetime-local" {...common} />;
    if (f.type === 'number') return <input type="number" {...common} />;
    return <input type="text" {...common} />;
  };

  return (
    <div>
      <div className="page-head" data-od-id={`${moduleKey}-head`}>
        <div>
          <h1>{cfg.label}</h1>
          <div className="sub">{cfg.sub}</div>
        </div>
        <div className="page-head__actions">
          <Btn variant="primary" icon="plus" onClick={openCreate}>新規作成</Btn>
          <Btn variant="outline" icon="download" onClick={() => toast('CSV出力（デモ）', 'info')}>CSV</Btn>
        </div>
      </div>

      {kpis.length > 0 && (
        <div className="kpi-grid" style={{ gridTemplateColumns: `repeat(${Math.min(kpis.length, 4)}, minmax(0,1fr))` }}>
          {kpis.map((k, i) => <KPI key={i} {...k} id={`${moduleKey}-kpi-${i}`} />)}
        </div>
      )}

      <div className="filter-bar">
        <SearchInput value={keyword} onChange={v => { setKeyword(v); setPage(1); }} placeholder={cfg.label + 'を検索...'} />
        {(cfg.filters || []).map(f => (
          <FilterSelect key={f.key} label={f.label} value={filters[f.key] || 'all'} options={f.options}
            onChange={v => { setFilters(p => ({ ...p, [f.key]: v === 'all' ? undefined : v })); setPage(1); }} />
        ))}
        <span className="spacer" />
        {(keyword || Object.values(filters).some(Boolean)) && <Btn variant="ghost" size="sm" onClick={() => { setKeyword(''); setFilters({}); setPage(1); }}>クリア</Btn>}
      </div>

      <DataTable
        id={`${moduleKey}-table`}
        columns={[...(cfg.columns || []), {
          key: '_actions', label: '', render: (_, row) => (
            <div className="td-actions" onClick={e => e.stopPropagation()}>
              <button className="row-btn" aria-label="編集" onClick={() => openEdit(row)}><Icon name="edit" size={15} /></button>
              <button className="row-btn row-btn--danger" aria-label="削除" onClick={() => setDeleteTarget(row)}><Icon name="trash" size={15} /></button>
            </div>
          )
        }]}
        data={data.items} loading={loading} sortKey={sortKey} sortDir={sortDir} onSort={handleSort}
        onRowClick={row => setDetailItem(row)} emptyMsg={cfg.label + 'のデータがありません'}
      />

      <Pagination page={page} total={data.total} size={pageSize} onChange={setPage} />

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={editItem ? cfg.label + ' 編集' : cfg.label + ' 新規作成'}
        footer={<>
          <Btn variant="outline" onClick={() => setModalOpen(false)}>キャンセル</Btn>
          <Btn variant="primary" onClick={handleSave}>{editItem ? '更新' : '作成'}</Btn>
        </>}>
        <div className="form-grid">
          {(cfg.formFields || []).map(f => (
            <div key={f.key} className={`field ${f.full ? 'field--full' : ''}`}>
              <label>{f.label}{f.required && <span className="req">*</span>}</label>
              {renderField(f)}
              {formErrors[f.key] && <span className="err">{formErrors[f.key]}</span>}
            </div>
          ))}
        </div>
      </Modal>

      <ConfirmDialog open={!!deleteTarget} onClose={() => setDeleteTarget(null)} onConfirm={handleDelete}
        title="削除確認" message={`「${deleteTarget?.title || deleteTarget?.name || ''}」を削除しますか？この操作は取り消せません。`} confirmLabel="削除" danger />

      <Modal open={!!detailItem} onClose={() => setDetailItem(null)} width={560}
        title={(detailItem && (detailItem[cfg.ticketField] || detailItem.name || '')) + ' 詳細'}
        footer={<>
          <Btn variant="outline" icon="edit" onClick={() => { openEdit(detailItem); setDetailItem(null); }}>編集</Btn>
          <Btn variant="primary" onClick={() => setDetailItem(null)}>閉じる</Btn>
        </>}>
        {detailItem && (
          <dl className="dl">
            {Object.entries(detailItem).filter(([k]) => k !== 'id').map(([k, v]) => (
              <React.Fragment key={k}>
                <dt>{k}</dt>
                <dd>
                  {['status','priority','severity','ci_type','asset_type','event_type','change_type','category','risk_level','patch_type'].includes(k) && v
                    ? <Pill value={v} />
                    : (typeof v === 'string' && v.match(/^\d{4}-/) ? fmtDate(v) : String(v ?? '—'))}
                </dd>
              </React.Fragment>
            ))}
          </dl>
        )}
      </Modal>
    </div>
  );
};

const SLAView = () => {
  const [data, setData] = useState({ items: [] });
  useEffect(() => { MockAPI.list('incidents', { limit: 100 }).then(setData); }, []);
  const items = data.items;
  const resolved = items.filter(x => x.resolved_at);
  const slaOk = resolved.filter(x => new Date(x.resolved_at) <= new Date(x.due_at)).length;
  const rate = resolved.length ? Math.round(slaOk / resolved.length * 100) : 100;
  const overdue = items.filter(x => !['resolved','closed'].includes(x.status) && x.due_at && new Date(x.due_at) < new Date());
  const atRisk = items.filter(x => { if (['resolved','closed'].includes(x.status) || !x.due_at) return false; const r = new Date(x.due_at) - new Date(); return r > 0 && r < 2 * 3600000; });
  const avgH = resolved.length ? resolved.reduce((s, x) => (new Date(x.resolved_at) - new Date(x.created_at)) / 3600000 + s, 0) / resolved.length : 0;

  return (
    <div>
      <div className="page-head" data-od-id="sla-head">
        <div>
          <h1>SLA監視</h1>
          <div className="sub">SLA遵守率・期限監視・リスク一覧</div>
        </div>
      </div>
      <div className="kpi-grid" style={{ gridTemplateColumns: 'repeat(4, minmax(0,1fr))' }}>
        <KPI id="sla-rate" icon="check" label="SLA遵守率" value={rate + '%'} tone={rate >= 90 ? 'success' : rate >= 70 ? 'warning' : 'danger'} />
        <KPI id="sla-overdue" icon="alert" label="期限超過" value={overdue.length + '件'} tone="danger" />
        <KPI id="sla-risk" icon="clock" label="リスク（2h以内）" value={atRisk.length + '件'} tone="warning" />
        <KPI id="sla-avg" icon="hourglass" label="平均解決時間" value={avgH.toFixed(1) + 'h'} tone="info" />
      </div>
      <div className="card">
        <div className="card__head"><h3>SLAリスク一覧</h3></div>
        <div style={{ padding: '14px 18px' }}>
          <DataTable id="sla-table" columns={[
            { key: 'ticket_no', label: 'チケット', cls: 'td-id' },
            { key: 'title', label: 'タイトル', cls: 'td-title' },
            { key: 'priority', label: '優先度', render: v => <Pill value={v} /> },
            { key: 'sla', label: 'SLA', render: (_, r) => <SLAPill dueAt={r.due_at} resolvedAt={r.resolved_at} /> },
            { key: 'due_at', label: '期限', render: v => <span className="mono tnum td-muted">{fmtDate(v, true)}</span>, cls: 'td-nowrap' },
          ]} data={[...overdue, ...atRisk]} emptyMsg="SLAリスクのチケットはありません" />
        </div>
      </div>
    </div>
  );
};

/* ============================================================
   App
   ============================================================ */
const App = () => {
  const [isDark, setIsDark] = useState(() => localStorage.getItem('itsm-dark') === 'true');
  const [collapsed, setCollapsed] = useState(() => localStorage.getItem('itsm-collapsed') === 'true');
  const [activeView, setActiveView] = useState(() => localStorage.getItem('itsm-view') || 'dashboard');

  useEffect(() => { document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light'); localStorage.setItem('itsm-dark', isDark); }, [isDark]);
  useEffect(() => { localStorage.setItem('itsm-collapsed', collapsed); }, [collapsed]);
  useEffect(() => { localStorage.setItem('itsm-view', activeView); }, [activeView]);

  const navigate = useCallback(view => {
    setActiveView(view);
    const main = document.getElementById('itsm-main');
    if (main) main.scrollTop = 0;
  }, []);

  const title = useMemo(() => {
    if (activeView === 'dashboard') return 'ダッシュボード';
    if (activeView === 'system-settings') return 'システム設定';
    const cfg = MODULE_CONFIGS[activeView];
    if (cfg) return cfg.label;
    const flat = NAV_SECTIONS.flatMap(s => s.items);
    const nav = flat.find(i => i.key === activeView);
    return nav ? nav.label : 'ITSM Management';
  }, [activeView]);

  const renderView = () => {
    switch (activeView) {
      case 'dashboard': return <DashboardView onNewIncident={() => navigate('incidents')} />;
      case 'sla': return <SLAView />;
      case 'realtime': return <RealtimeView />;
      case 'visualization': return <VisualizationView />;
      case 'automation': return <AutomationView />;
      case 'system-settings': return <SettingsView isDark={isDark} onToggleDark={() => setIsDark(p => !p)} />;
      default:
        if (MODULE_CONFIGS[activeView]) return <ModuleView key={activeView} moduleKey={activeView} />;
        return <div className="page-head"><h1>準備中</h1><div className="sub">このモジュールは開発中です</div></div>;
    }
  };

  return (
    <ToastProvider>
      <div className="app">
        <Sidebar activeView={activeView} onNavigate={navigate} collapsed={collapsed} />
        <div className="main">
          <Header
            title={title}
            isDark={isDark}
            onToggleDark={() => setIsDark(p => !p)}
            collapsed={collapsed}
            onToggleCollapse={() => setCollapsed(p => !p)}
          />
          <main id="itsm-main" className="content" role="main">
            {renderView()}
          </main>
        </div>
      </div>
    </ToastProvider>
  );
};

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);
</script>
